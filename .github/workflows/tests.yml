name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ubuntu-latest ships Google Chrome; the test finds it at /usr/bin/google-chrome
      - name: Run browser smoke test
        run: node tests/ui_smoke.mjs
        env:
          CI: "true"
