<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1a33">
<title>Command Center · Automation OS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png?v=2">
<style>
:root{color-scheme:light;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;
--bg:#e9edf5;--card:#fff;--card2:#f4f6fb;--sunken:#e3e8f2;--ink:#0c1a33;--ink2:#46526d;--muted:#7a86a1;--line:#dbe1ee;--line2:#c7cfe0;
--accent:#ff5a36;--accent-hi:#e64622;--accent-soft:#ffe8e1;--on-accent:#fff;
--blue:#2757ff;--blue-soft:#e3eaff;--good:#0f9d6e;--good-soft:#dff5ec;--warn:#d98206;--warn-soft:#fdf0d8;--bad:#dc2f48;--bad-soft:#fde5e9;
--navy:#0c1a33;--navy2:#16294d;--r:18px;--r2:12px;--shadow:0 1px 2px #0c1a3310,0 12px 32px -18px #0c1a3340}
:root[data-theme=dark]{color-scheme:dark;--bg:#070b15;--card:#0f1627;--card2:#141d33;--sunken:#0a101e;--ink:#eef2fb;--ink2:#b1bcd4;--muted:#7685a4;--line:#1d2842;--line2:#2b3a5c;
--accent:#ff6b4a;--accent-hi:#ff8266;--accent-soft:#3a1d19;--on-accent:#1b0804;--blue:#7c9bff;--blue-soft:#18244a;--good:#34d399;--good-soft:#0f2e25;--warn:#f5b13d;--warn-soft:#33270e;--bad:#ff7088;--bad-soft:#3b1620;
--navy:#0f1a33;--navy2:#18284a;--shadow:0 1px 0 #00000050,0 14px 34px -18px #000000b0}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);line-height:1.5}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 100% 0,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),radial-gradient(50% 40% at 0 100%,color-mix(in srgb,var(--blue) 10%,transparent),transparent 70%);z-index:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
/* top island */
.shell{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:14px 22px 60px}
.bar{position:sticky;top:12px;z-index:30;display:flex;align-items:center;gap:18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 14px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 210deg,var(--accent),#ff9a3c,var(--blue),var(--accent));display:grid;place-items:center}
.logo i:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--card)}
.groups{display:flex;gap:4px;margin:0 auto 0 6px;overflow-x:auto;scrollbar-width:none}.groups::-webkit-scrollbar{display:none}
.groups button{border:0;background:transparent;color:var(--ink2);padding:8px 15px;border-radius:999px;font-weight:650;font-size:13.5px;white-space:nowrap;transition:.15s}
.groups button:hover{background:var(--card2);color:var(--ink)}
.groups button.on{background:var(--navy);color:#fff}
:root[data-theme=dark] .groups button.on{background:var(--ink);color:var(--bg)}
.barright{display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--card2);color:var(--muted);font-size:13px;min-width:190px}
.search:hover{border-color:var(--blue);color:var(--ink2)}
kbd{font:600 11px/1 inherit;font-family:Consolas,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:3px 6px;background:var(--card);color:var(--ink2);margin-left:auto}
.ib{width:38px;height:38px;border:1px solid var(--line2);border-radius:50%;background:var(--card);color:var(--ink2);display:grid;place-items:center;font-size:16px}
.ib:hover{border-color:var(--blue);color:var(--blue)}
.subnav{display:flex;gap:6px;margin:16px 4px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.subnav::-webkit-scrollbar{display:none}
.subnav button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--ink2);padding:7px 13px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap}
.subnav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.subnav button:hover{background:var(--card);color:var(--ink)}
.subnav button.on{background:var(--card);border-color:var(--line);color:var(--accent);box-shadow:var(--shadow)}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
/* page */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:26px 4px 22px;flex-wrap:wrap}
.pagehead h1{font-size:34px;letter-spacing:-.035em;font-weight:800;margin:0;line-height:1.1}
.pagehead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:0 16px;height:40px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--card);color:var(--ink);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent)}
.btn.pri:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:var(--on-accent)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.dark:hover{background:var(--navy2);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.good:hover{filter:brightness(1.08);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}.btn.bad:hover{background:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.6;cursor:wait}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;min-width:0}
.c h2{font-size:16px;font-weight:750;letter-spacing:-.01em;margin:0}
.c .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.c .hd small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:2px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0;position:relative;overflow:hidden;padding:30px;display:flex;flex-direction:column;justify-content:space-between;min-height:230px}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 65%);opacity:.55}
.hero:after{content:"";position:absolute;right:90px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--blue) 0,transparent 65%);opacity:.5}
.hero>*{position:relative;z-index:1}
.hero .eb{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#ffffffa8}
.hero h2{font-size:34px;letter-spacing:-.035em;font-weight:800;margin:6px 0 8px;line-height:1.1;color:#fff}
.hero p{margin:0;color:#ffffffc4;max-width:520px;font-size:14.5px}
.hero .acts{margin-top:22px}.hero .btn:not(.pri){background:#ffffff1a;border-color:#ffffff33;color:#fff}.hero .btn:not(.pri):hover{background:#ffffff2e}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
.kpi .l{font-size:12.5px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .l i{width:8px;height:8px;border-radius:50%;background:var(--k,var(--accent))}
.kpi b{font-size:44px;letter-spacing:-.05em;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span.n{font-size:12.5px;color:var(--muted)}
.kpi:after{content:"↗";position:absolute;right:18px;top:16px;color:var(--muted);font-size:15px;opacity:0;transition:.18s}.kpi:hover:after{opacity:1}
.ringbox{display:flex;align-items:center;gap:20px;height:100%}
.ring{width:128px;height:128px;flex:0 0 128px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}.ring .bg{stroke:var(--sunken)}.ring .fg{stroke:var(--good);transition:stroke-dasharray .8s}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;letter-spacing:-.04em}
.legend{display:grid;gap:8px;font-size:13px;color:var(--ink2)}.legend b{color:var(--ink)}
.bars{display:grid;gap:13px}.bar2 .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px;text-transform:capitalize}
.bar2 .trk{height:9px;border-radius:9px;background:var(--sunken);overflow:hidden}.bar2 .fil{height:100%;border-radius:9px;background:var(--k,var(--blue));transition:width .7s}
.feed{display:grid;gap:2px}
.fi{display:flex;gap:13px;align-items:flex-start;padding:12px 10px;border-radius:12px;transition:.12s}.fi:hover{background:var(--card2)}
.fi .sv{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px;background:var(--warn)}.fi .sv.high{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.fi b{display:block;font-size:14px;font-weight:650}.fi small{color:var(--muted);font-size:12.5px}.fi .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fi input[type=checkbox]{margin-top:4px}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
/* badges */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--sunken);color:var(--ink2);white-space:nowrap}.badge:first-letter{text-transform:uppercase}
.badge.good,.badge.done,.badge.approved,.badge.yes{background:var(--good-soft);color:var(--good)}
.badge.bad,.badge.high,.badge.blocked,.badge.rejected{background:var(--bad-soft);color:var(--bad)}
.badge.warn,.badge.medium,.badge.pending,.badge.in_progress{background:var(--warn-soft);color:var(--warn)}
.badge.blue,.badge.open{background:var(--blue-soft);color:var(--blue)}
/* toolbar */
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 16px}
.sbox{position:relative;flex:1;min-width:200px;max-width:420px}
.sbox input{width:100%;height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px 0 38px}
.sbox:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:18px;color:var(--muted)}
.sbox input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--ink2);text-transform:capitalize}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0c1a331f}
.count{margin-left:auto;color:var(--muted);font-size:13px}
/* cards & board */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;transition:.15s;min-width:0}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card.drag{opacity:.4}
.card:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--edge,transparent)}
.card.e-high{--edge:var(--bad)}.card.e-medium{--edge:var(--warn)}.card.e-low{--edge:var(--line2)}
.card h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .sub{color:var(--muted);font-size:12.5px}.card .body{color:var(--ink2);font-size:13px;margin:0;line-height:1.5}
.card .money{font-size:22px;font-weight:800;letter-spacing:-.03em}.card .money small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.card .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.card .foot .sp{margin-left:auto}
.ln{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:4px 7px;border-radius:7px}.ln:hover{background:var(--card2);color:var(--blue)}.ln.d:hover{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12px;color:var(--ink2);background:var(--card2);border-radius:9px;padding:7px 10px}
.status{border:1px solid var(--line2);border-radius:8px;background:var(--card2);padding:4px 8px;font-size:12px;font-weight:600;color:var(--ink2)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--sunken);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px;transition:.15s}
.col.over{outline:2px dashed var(--blue);background:var(--blue-soft)}
.col>h4{margin:2px 4px 2px;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:800}
.col>h4 em{font-style:normal;background:var(--card);border-radius:9px;padding:1px 8px;font-size:11px;color:var(--muted)}
.col .card{box-shadow:none}
.mt{color:var(--muted);text-align:center;font-size:12.5px;padding:18px 6px}
/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.tw::-webkit-scrollbar{height:8px}.tw::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--card2);font-weight:800;position:sticky;top:0}
tbody tr:hover{background:var(--card2)}tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:220px;max-width:440px}
table.act th:last-child,table.act td:last-child{position:sticky;right:0;background:var(--card);box-shadow:-10px 0 10px -10px #0003}table.act th:last-child{background:var(--card2)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:var(--ink2)}.field label i{color:var(--accent);font-style:normal}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:11px;padding:10px 13px;min-height:42px;transition:.15s}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--blue);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.7}
.stack{display:grid;gap:16px}
/* drawer */
.back{position:fixed;inset:0;background:#050912a8;backdrop-filter:blur(3px);z-index:90;display:flex;justify-content:flex-end;animation:fade .2s}
.drawer{width:min(460px,100%);height:100%;background:var(--card);border-left:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:20px;overflow:auto;animation:slide .25s cubic-bezier(.2,.8,.2,1)}
.drawer header{display:flex;align-items:center;justify-content:space-between}.drawer h2{font-size:22px;letter-spacing:-.03em;margin:0;font-weight:800}
.drawer form{display:flex;flex-direction:column;gap:16px;flex:1}.drawer .fx{margin-top:auto;display:flex;gap:10px;padding-top:8px}.drawer .fx .btn{flex:1}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}
/* palette */
.pal{position:fixed;inset:0;z-index:120;background:#050912b3;backdrop-filter:blur(4px);display:flex;justify-content:center;padding-top:14vh;animation:fade .15s}
.pbox{width:min(560px,92vw);height:fit-content;max-height:70vh;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px #0006;overflow:hidden;display:flex;flex-direction:column}
.pbox input{border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:16px;background:transparent;outline:0}
.plist{overflow:auto;padding:8px}.plist button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
.plist button small{margin-left:auto;color:var(--muted);font-weight:500}.plist button svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plist button.on{background:var(--blue-soft);color:var(--blue)}.plist button.on svg{stroke:var(--blue)}
/* misc */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:200;font-size:13.5px;font-weight:600;box-shadow:0 18px 40px #0000005c;max-width:90vw;animation:up .25s}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}}
.empty{text-align:center;color:var(--muted);padding:46px 16px;border:2px dashed var(--line2);border-radius:16px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.sw{position:relative;width:46px;height:26px;flex:0 0 46px}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.2s}.sw span:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 1px 3px #0004}
.sw input:checked+span{background:var(--good)}.sw input:checked+span:after{transform:translateX(20px)}
.rule{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}.rule b{display:block;font-size:14px}.rule small{color:var(--muted)}
.drop{display:block;border:2px dashed var(--line2);border-radius:16px;padding:34px;text-align:center;color:var(--ink2);cursor:pointer;transition:.15s;background:var(--card2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}.drop b{display:block;font-size:15px;color:var(--ink)}.drop input{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:650;color:var(--ink2)}.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme=dark] .chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--card2)}details+details{margin-top:8px}summary{cursor:pointer;font-weight:700;font-size:13.5px}details code{display:block;margin-top:8px;font-size:12px;color:var(--blue);word-break:break-word}
pre{font-family:Consolas,monospace;background:var(--sunken);color:var(--ink2);padding:16px;border-radius:12px;white-space:pre-wrap;line-height:1.7;overflow:auto;font-size:13px;margin:0}
p{color:var(--ink2);line-height:1.65;font-size:14px;margin:0 0 12px}
.tl{display:grid;gap:0}.tl .fi{border-left:2px solid var(--line);border-radius:0 12px 12px 0;margin-left:6px}
.tag2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

<body>
